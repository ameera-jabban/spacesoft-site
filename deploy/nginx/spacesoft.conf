# nginx site config for spacesofterp.com (DigitalOcean droplet, behind Cloudflare).
# Install:  sudo cp deploy/nginx/spacesoft.conf /etc/nginx/sites-available/spacesofterp.com
#           sudo ln -sf /etc/nginx/sites-available/spacesofterp.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Adjust `root`, the certificate paths and the include path to match the server.

# Assets referenced with ?v=<content hash> never change -> cache for a year.
# Unversioned asset URLs (og-image, favicon fetched by bots) -> one day.
map $arg_v $ss_asset_cache {
    ""      "public, max-age=86400";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name spacesofterp.com www.spacesofterp.com;
    return 301 https://spacesofterp.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.spacesofterp.com;
    ssl_certificate     /etc/ssl/cloudflare/spacesofterp.com.pem;   # Cloudflare origin certificate
    ssl_certificate_key /etc/ssl/cloudflare/spacesofterp.com.key;
    return 301 https://spacesofterp.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spacesofterp.com;

    ssl_certificate     /etc/ssl/cloudflare/spacesofterp.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/spacesofterp.com.key;

    root  /var/www/spacesofterp.com;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    error_page 404 /404.html;

    # Sources, tooling and repo metadata are never served.
    location ~ ^/(src|tools|deploy)(/|$)  { return 404; }
    location ~ /\.                        { return 404; }   # .git, .gitattributes, ...
    location ~ \.(md|py|sh|ps1)$          { return 404; }

    # HTML: always revalidate so a deploy is visible immediately (ETag keeps it cheap).
    location / {
        include /var/www/spacesofterp.com/deploy/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        include /var/www/spacesofterp.com/deploy/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        internal;
    }

    # Images, video, fonts, CSS, JS.
    location /assets/ {
        include /var/www/spacesofterp.com/deploy/nginx/security-headers.conf;
        add_header Cache-Control $ss_asset_cache always;
        try_files $uri =404;
    }

    location = /config.js {
        include /var/www/spacesofterp.com/deploy/nginx/security-headers.conf;
        add_header Cache-Control $ss_asset_cache always;
    }

    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        include /var/www/spacesofterp.com/deploy/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
